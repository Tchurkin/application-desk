name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  mac-counselor:
    name: Mac counselor (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Mac counselor's setup and watcher, run for real against a stand-in desk and Claude Code.
      - run: npx vitest run src/lib/counselor

  e2e:
    name: End-to-end (two browsers, local Supabase)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The database is built from supabase/setup.sql, the way a hosted project is set up, not from
      # the migrations folder: the tests then prove that file works.
      - name: Start Supabase with no migrations
        run: |
          mkdir -p "$RUNNER_TEMP/migrations"
          mv supabase/migrations/*.sql "$RUNNER_TEMP/migrations/"
          npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      # The live database as it was on 9/26/26: migrations pasted by hand up to 20261012, skipping
      # 20261008, 20261009 and 20261011. setup.sql runs those late (they change nothing the later
      # ones do) and the rest after them.
      - name: Bring a database that skipped migrations up to date, then start over
        run: |
          eval "$(npx supabase status -o env)"
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          db="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          for f in "$RUNNER_TEMP"/migrations/*.sql; do
            v=$(basename "$f" | cut -c1-8)
            case "$v" in 20261008|20261009|20261011) continue ;; esac
            if [[ "$v" > "20261012" ]]; then continue; fi
            psql "$db" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/setup.sql 2>&1 | tee "$RUNNER_TEMP/gap-1.txt"
          grep -q "Applied 20261008000000_trash (it had been skipped)" "$RUNNER_TEMP/gap-1.txt"
          grep -q "Applied 20261015000000_profile_files" "$RUNNER_TEMP/gap-1.txt"
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/setup.sql 2>&1 | tee "$RUNNER_TEMP/gap-2.txt"
          grep -q "up to date: nothing to do" "$RUNNER_TEMP/gap-2.txt"
          test "$(psql "$db" -tAc "select count(*) from pg_trigger where tgname = 'forget_unconfirmed_password'")" = 0
          npx supabase db reset
      - name: Set up the database from supabase/setup.sql, then check a second run does nothing
        run: |
          eval "$(npx supabase status -o env)"
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          db="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/setup.sql 2>&1 | tee "$RUNNER_TEMP/setup-1.txt"
          grep -q "Done: applied" "$RUNNER_TEMP/setup-1.txt"
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/setup.sql 2>&1 | tee "$RUNNER_TEMP/setup-2.txt"
          grep -q "up to date: nothing to do" "$RUNNER_TEMP/setup-2.txt"
      - name: Point the app at it
        run: |
          eval "$(npx supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          # Tests only: makes accounts and sign-in codes directly (e2e/helpers.ts). Never in the app.
          echo "::add-mask::${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=${INBUCKET_URL:-${MAILPIT_URL:-http://127.0.0.1:54324}}" >> "$GITHUB_ENV"
      - name: Sign in by code, as the site will (docs/sign-in.md)
        run: |
          eval "$(npx supabase status -o env)"
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql "${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -v ON_ERROR_STOP=1 -f supabase/sign-in-code.sql
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_E2E: "1"
          # Students sign in with an emailed code here, as the site will once it can send email.
          NEXT_PUBLIC_SIGN_IN: code
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
